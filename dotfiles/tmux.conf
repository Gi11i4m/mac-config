# Colours
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Behaviour
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 10
set -g focus-events on
set -g set-clipboard on

# Splits and new windows open in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Mouse selection copies to the macOS clipboard
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel pbcopy
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel pbcopy

# Status bar
set -g status-style "bg=default,fg=colour245"
set -g status-left "#[fg=colour39,bold]#S #[default]"
set -g status-left-length 30
set -g status-right "%a %d %b %H:%M"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=colour39,bold] #I:#W "
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"
